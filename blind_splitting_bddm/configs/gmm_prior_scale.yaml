seed: 123
device: cuda
dtype: float64
save_dir: blind_splitting_bddm/results/prior_scale

prior:
  type: lowdim_gmm
  intrinsic_dim: 2
  ambient_dim: 50
  diag_noise: 1.0e-4
  latent_std: 0.15
  separation: 1.5

sigma_grid:
  min: 0.01
  max: 3.0
  n: 128
  spacing: log

d_values: [2, 10, 50, 100, 500, 1000]

experiments:
  n_trials: 512
  sigmas: [0.05, 0.1, 0.3, 1.0]
